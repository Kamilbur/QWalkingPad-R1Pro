name: Build and publish QWalkingPad AppImage

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  appimage:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-24.04

    steps:
      - name: Check out tagged source (including submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ curl file \
            qmake6 qt6-base-dev qt6-connectivity-dev qt6-wayland \
            libfuse2t64 libxkbcommon-dev

      - name: Initialize SingleApplication submodule
        run: |
          git config -f .gitmodules \
            submodule.singleapplication.url \
            https://github.com/itay-grudev/SingleApplication.git

          git submodule sync --recursive
          git submodule update --init --recursive

          test -f singleapplication/CMakeLists.txt || {
            echo "::error::SingleApplication submodule missing"
            exit 1
          }

      - name: Build QWalkingPad
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          test -x build/qwalkinkpad2

      - name: Create desktop file and icon
        run: |
          mkdir -p packaging
          cat > packaging/qwalkinkpad2.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=QWalkingPad
          Comment=Local Bluetooth WalkingPad controller
          Exec=qwalkinkpad2
          Icon=qwalkinkpad2
          Terminal=false
          Categories=Utility;
          EOF
          cat > packaging/qwalkinkpad2.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
            <rect width="128" height="128" rx="20" fill="#253147"/>
            <rect x="18" y="70" width="92" height="27" rx="13" fill="#99b9d8"/>
            <path d="M30 84h68" stroke="#253147" stroke-width="4" stroke-linecap="round"/>
            <circle cx="64" cy="34" r="9" fill="white"/>
            <path d="M64 46L56 61L74 70M64 48L82 60M56 61L42 74" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          EOF

      - name: Download linuxdeploy and Qt plugin
        run: |
          mkdir -p tools
          curl --fail --location --retry 3 \
            --output tools/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage
          curl --fail --location --retry 3 \
            --output tools/linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x tools/*.AppImage

      - name: Prepare AppDir with Qt and Bluetooth dependencies
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          EXTRA_PLATFORM_PLUGINS: 'libqwayland-egl.so;libqwayland-generic.so'
        run: |
          export QMAKE="$(command -v qmake6)"
          ./tools/linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable build/qwalkinkpad2 \
            --desktop-file packaging/qwalkinkpad2.desktop \
            --icon-file packaging/qwalkinkpad2.svg \
            --plugin qt

      - name: Bundle missing Qt Wayland shell and EGL integrations
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          QT_PLUGINS="$(qmake6 -query QT_INSTALL_PLUGINS)"
          echo "Qt plugins directory: $QT_PLUGINS"

          # linuxdeploy's Qt plugin bundles the Wayland *platform* plugins,
          # but the runtime also needs xdg-shell and EGL integration plugins.
          # Use the plugins from the same Qt installation as the build.
          declare -a EXTRA_QT_PLUGINS=(
            "wayland-shell-integration/libxdg-shell.so"
            "wayland-graphics-integration-client/libqt-plugin-wayland-egl.so"
          )
          for relative in "${EXTRA_QT_PLUGINS[@]}"; do
            source="$QT_PLUGINS/$relative"
            test -f "$source" || {
              echo "::error::Missing Qt Wayland plugin: $source"
              exit 1
            }
            install -D -m 755 "$source" "AppDir/usr/plugins/$relative"
          done

          # Let linuxdeploy gather library dependencies of these dynamically
          # loaded plugins; simply copying the .so files isn't sufficient.
          ./tools/linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --library "$QT_PLUGINS/wayland-shell-integration/libxdg-shell.so" \
            --library "$QT_PLUGINS/wayland-graphics-integration-client/libqt-plugin-wayland-egl.so"

          # Fail the build if the critical plugins are absent from the AppDir.
          test -f AppDir/usr/plugins/wayland-shell-integration/libxdg-shell.so
          test -f AppDir/usr/plugins/wayland-graphics-integration-client/libqt-plugin-wayland-egl.so
          echo 'Included Wayland plugins:'
          find AppDir/usr/plugins -path '*wayland*' -type f -print

      - name: Create AppImage and SHA256 checksum
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          export LDAI_OUTPUT="QWalkingPad-${GITHUB_REF_NAME}-x86_64.AppImage"
          ./tools/linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --output appimage

          test -s "$LDAI_OUTPUT"
          file "$LDAI_OUTPUT"

          # Verify the final AppImage (not just the staging AppDir) includes
          # the native Wayland integration plugins and the matching Qt client.
          rm -rf squashfs-root
          "./$LDAI_OUTPUT" --appimage-extract >/dev/null
          test -f squashfs-root/usr/plugins/platforms/libqwayland-generic.so
          test -f squashfs-root/usr/plugins/wayland-shell-integration/libxdg-shell.so
          test -f squashfs-root/usr/plugins/wayland-graphics-integration-client/libqt-plugin-wayland-egl.so
          find squashfs-root/usr/lib -maxdepth 1 -name 'libQt6WaylandClient.so*' | grep -q .
          rm -rf squashfs-root

          sha256sum "$LDAI_OUTPUT" > "$LDAI_OUTPUT.sha256"

      - name: Attach AppImage to GitHub Release
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            QWalkingPad-*.AppImage
            QWalkingPad-*.AppImage.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

